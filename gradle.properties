# Project-wide Gradle settings.

# Run the Gradle daemon with a larger heap for faster builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required for modern Android & Leanback libraries).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Enable parallel and cached builds for speed.
org.gradle.parallel=true
org.gradle.caching=true

# Only generate the resources for the densities/configs we actually ship.
android.nonTransitiveRClass=true
